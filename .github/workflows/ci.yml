name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install system search tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install Node dependencies
        run: npm ci
      - name: Install ast-grep
        run: npm install --global @ast-grep/cli@0.45.1
      - name: Install Python package
        run: python -m pip install './python[test]'
      - name: Install documentation tools
        run: python -m pip install './python[docs]'
      - name: Test TypeScript and CLI
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Benchmark harness self-test
        run: npm run benchmark:self-test
      - name: Test Python package
        run: python -m pytest python/tests
      - name: Inspect npm package
        run: npm pack --dry-run
      - name: Check documentation links and paths
        run: npm run docs:check
      - name: Build Sphinx documentation
        run: npm run docs:build
