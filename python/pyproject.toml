[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tfs-ripast"
version = "0.1.0"
description = "Sandboxed plan compiler and Python launcher for TFS Ripast"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Torafirma Systems" }]
dependencies = [
  "Jinja2>=3.1,<4",
  "jsonschema>=4.18,<5",
]

[project.scripts]
tfs-ripast = "tfs_ripast.__main__:main"
rpst = "tfs_ripast.__main__:main"

[project.urls]
Homepage = "https://github.com/torakagemusha-sudo/tfs-ripast"
Repository = "https://github.com/torakagemusha-sudo/tfs-ripast.git"
Issues = "https://github.com/torakagemusha-sudo/tfs-ripast/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
docs = ["Sphinx>=7,<9", "myst-parser>=3,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tfs_ripast*"]

[tool.setuptools.package-data]
tfs_ripast = ["_schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
