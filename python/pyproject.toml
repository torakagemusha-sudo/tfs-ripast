[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfs-ripast"
version = "0.1.1"
description = "Sandboxed plan compiler and Python launcher for TFS Ripast"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
docs = ["Sphinx>=7,<9", "myst-parser>=3,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tfs_ripast*"]

[tool.setuptools.package-data]
tfs_ripast = ["_schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
